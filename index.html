<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberGuigu-Liuren | 小六壬十二時辰全解法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            
            /* 沉穩柔和的吉凶半透明背景色 */
            --bg-lucky: rgba(30, 77, 58, 0.85);
            --border-lucky: #44aa77;
            --text-lucky: #88ffcc;

            --bg-unlucky: rgba(92, 38, 38, 0.85);
            --border-unlucky: #cc5555;
            --text-unlucky: #ff9999;

            --warning-glow: #ffaa00;
            --text-color: #bfa381;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        /* 控制面板通用樣式 */
        .control-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(22, 18, 14, 0.95);
            border: 1px solid var(--ring-border);
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .control-panel label {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .control-panel input {
            width: 55px;
            background: #070605;
            border: 1px solid var(--ring-border);
            color: var(--patina-glow);
            padding: 6px;
            text-align: center;
            font-size: 16px;
            border-radius: 4px;
            outline: none;
        }

        /* 隱除數字輸入上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .control-panel button {
            background: #221a14;
            color: var(--patina-glow);
            border: 1px solid var(--patina-glow);
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .control-panel button:active {
            background: var(--patina-glow);
            color: var(--bg-deep);
        }

        /* 下方 8 格解碼陣列面板專屬樣式 */
        .decoder-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(22, 18, 14, 0.95);
            border: 1px solid var(--ring-border);
            padding: 12px 18px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            max-width: 450px;
            width: 100%;
        }

        .decoder-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--warning-glow);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .decoder-inputs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
            flex-wrap: wrap;
        }

        .decoder-inputs input {
            width: 38px;
            height: 38px;
            background: #070605;
            border: 1px solid var(--ring-border);
            color: var(--warning-glow);
            text-align: center;
            font-size: 16px;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        .decoder-inputs input:focus {
            border-color: var(--warning-glow);
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }

        .decoder-btn {
            background: #221a14;
            color: var(--warning-glow);
            border: 1px solid var(--warning-glow);
            padding: 6px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .decoder-btn:active {
            background: var(--warning-glow);
            color: var(--bg-deep);
        }

        /* 手機完美自適應容器 */
        .svg-wrapper {
            position: relative; 
            display: inline-block;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
        }

        .ring-container {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.9));
        }

        .ring-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ring-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        /* 內環六宮選取狀態 */
        .inner-group.active .ring-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 8px var(--patina-glow));
        }

        /* 外環十二地支選取狀態 */
        .outer-group.active .ring-path {
            fill: rgba(255, 170, 0, 0.15);
            stroke: var(--warning-glow);
            filter: drop-shadow(0 0 8px var(--warning-glow));
        }

        .inner-text {
            fill: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .inner-group.active .inner-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 6px var(--patina-glow);
        }

        .outer-text {
            fill: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .outer-group.active .outer-text {
            fill: var(--warning-glow);
            text-shadow: 0 0 6px var(--warning-glow);
        }

        /* 中心圓形解說面板 (預設狀態) */
        .center-panel {
            background: rgba(10, 8, 7, 0.95);
            border: 1px solid var(--ring-border);
            border-radius: 50%;
            width: 32%;
            height: 32%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
            z-index: 5;
        }

        .center-title {
            font-size: clamp(11px, 3.2vw, 15px);
            font-weight: bold;
            color: var(--patina-glow);
            margin-bottom: 3px;
            letter-spacing: 1px;
        }

        .center-desc {
            font-size: clamp(9px, 2.3vw, 11px);
            color: var(--text-color);
            padding: 0 8px;
            line-height: 1.3;
        }

        /* 動態吉凶背景填滿樣式 */
        .center-panel.panel-lucky {
            background: var(--bg-lucky);
            border-color: var(--border-lucky);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 0 12px rgba(68, 170, 119, 0.4);
        }
        .center-panel.panel-lucky .center-title { color: var(--text-lucky); }
        .center-panel.panel-lucky .center-desc { color: #e6fff2; }

        .center-panel.panel-unlucky {
            background: var(--bg-unlucky);
            border-color: var(--border-unlucky);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 0 12px rgba(204, 85, 85, 0.4);
        }
        .center-panel.panel-unlucky .center-title { color: var(--text-unlucky); }
        .center-panel.panel-unlucky .center-desc { color: #ffe6e6; }

        /* 手機直向螢幕微調支援 */
        @media (max-width: 480px) {
            .control-panel, .decoder-panel {
                width: 100%;
                padding: 8px 10px;
                margin-bottom: 10px;
            }
            .control-panel input {
                width: 50px;
            }
            .decoder-inputs input {
                width: 32px;
                height: 34px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 上方月日輸入控制面板 -->
    <div class="control-panel">
        <label for="lunar-month">農曆月:</label>
        <input type="number" id="lunar-month" min="1" max="12" placeholder="1-12">
        
        <label for="lunar-day">農曆日:</label>
        <input type="number" id="lunar-day" min="1" max="30" placeholder="1-30">
        
        <button onclick="calculateLiuren()">排盤計算</button>
    </div>

    <!-- 手機響應式外框容器 -->
    <div class="svg-wrapper">
        
        <!-- 內環中心空白處的資訊面板 (動態填滿吉凶色彩) -->
        <div class="center-panel" id="center-info-box">
            <div class="center-title" id="center-title">小六壬</div>
            <div class="center-desc" id="center-desc">請輸入月日或下方靈能序列進行排盤</div>
        </div>

        <svg class="ring-container" viewBox="-230 -230 460 460">
            
            <!-- ================= 區塊一：內環六宮 ================= -->
            <g id="inner-layer">
                <g class="inner-group" onclick="selectInner(0)" id="inner-0">
                    <path class="ring-path" d="M 35 -60.62 L 65 -112.58 A 130 130 0 0 1 130 0 L 70 0 A 70 70 0 0 0 35 -60.62 Z" />
                    <text class="inner-text" x="75" y="-65">留</text>
                    <text class="inner-text" x="95" y="-30">連</text>
                </g>
                <g class="inner-group" onclick="selectInner(1)" id="inner-1">
                    <path class="ring-path" d="M 70 0 L 130 0 A 130 130 0 0 1 65 112.58 L 35 60.62 A 70 70 0 0 0 70 0 Z" />
                    <text class="inner-text" x="95" y="30">速</text>
                    <text class="inner-text" x="75" y="65">喜</text>
                </g>
                <g class="inner-group" onclick="selectInner(2)" id="inner-2">
                    <path class="ring-path" d="M 35 60.62 L 65 112.58 A 130 130 0 0 1 -65 112.58 L -35 60.62 A 70 70 0 0 0 35 60.62 Z" />
                    <text class="inner-text" x="0" y="100">赤 口</text>
                </g>
                <g class="inner-group" onclick="selectInner(3)" id="inner-3">
                    <path class="ring-path" d="M -35 60.62 L -65 112.58 A 130 130 0 0 1 -130 0 L -70 0 A 70 70 0 0 0 -35 60.62 Z" />
                    <text class="inner-text" x="-95" y="30">小</text>
                    <text class="inner-text" x="-75" y="65">吉</text>
                </g>
                <g class="inner-group" onclick="selectInner(4)" id="inner-4">
                    <path class="ring-path" d="M -70 0 L -130 0 A 130 130 0 0 1 -65 -112.58 L -35 -60.62 A 70 70 0 0 0 -70 0 Z" />
                    <text class="inner-text" x="-75" y="-65">空</text>
                    <text class="inner-text" x="-95" y="-30">亡</text>
                </g>
                <g class="inner-group" onclick="selectInner(5)" id="inner-5">
                    <path class="ring-path" d="M -35 -60.62 L -65 -112.58 A 130 130 0 0 1 65 -112.58 L 35 -60.62 A 70 70 0 0 0 -35 -60.62 Z" />
                    <text class="inner-text" x="0" y="-100">大 安</text>
                </g>
            </g>

            <!-- ================= 區塊二：外環十二地支 ================= -->
            <g id="outer-layer">
                <g class="outer-group" onclick="selectOuter(0)" id="outer-0">
                    <path class="ring-path" d="M -46.56 -173.88 A 180 180 0 0 1 46.56 -173.88 L 54.32 -202.87 A 210 210 0 0 0 -54.32 -202.87 Z" />
                    <text class="outer-text" x="0" y="-195">子</text>
                </g>
                <g class="outer-group" onclick="selectOuter(1)" id="outer-1">
                    <path class="ring-path" d="M 46.56 -173.88 A 180 180 0 0 1 127.28 -127.28 L 148.49 -148.49 A 210 210 0 0 0 54.32 -202.87 Z" />
                    <text class="outer-text" x="100" y="-170">丑</text>
                </g>
                <g class="outer-group" onclick="selectOuter(2)" id="outer-2">
                    <path class="ring-path" d="M 127.28 -127.28 A 180 180 0 0 1 173.88 -46.56 L 202.87 -54.32 A 210 210 0 0 0 148.49 -148.49 Z" />
                    <text class="outer-text" x="167" y="-100">寅</text>
                </g>
                <g class="outer-group" onclick="selectOuter(3)" id="outer-3">
                    <path class="ring-path" d="M 173.88 -46.56 A 180 180 0 0 1 173.88 46.56 L 202.87 54.32 A 210 210 0 0 0 202.87 -54.32 Z" />
                    <text class="outer-text" x="194" y="0">卯</text>
                </g>
                <g class="outer-group" onclick="selectOuter(4)" id="outer-4">
                    <path class="ring-path" d="M 173.88 46.56 A 180 180 0 0 1 127.28 127.28 L 148.49 148.49 A 210 210 0 0 0 202.87 54.32 Z" />
                    <text class="outer-text" x="167" y="100">辰</text>
                </g>
                <g class="outer-group" onclick="selectOuter(5)" id="outer-5">
                    <path class="ring-path" d="M 127.28 127.28 A 180 180 0 0 1 46.56 173.88 L 54.32 202.87 A 210 210 0 0 0 148.49 148.49 Z" />
                    <text class="outer-text" x="100" y="167">巳</text>
                </g>
                <g class="outer-group" onclick="selectOuter(6)" id="outer-6">
                    <path class="ring-path" d="M 46.56 173.88 A 180 180 0 0 1 -46.56 173.88 L -54.32 202.87 A 210 210 0 0 0 54.32 202.87 Z" />
                    <text class="outer-text" x="0" y="195">午</text>
                </g>
                <g class="outer-group" onclick="selectOuter(7)" id="outer-7">
                    <path class="ring-path" d="M -46.56 173.88 A 180 180 0 0 1 -127.28 127.28 L -148.49 148.49 A 210 210 0 0 0 -54.32 202.87 Z" />
                    <text class="outer-text" x="-100" y="167">未</text>
                </g>
                <g class="outer-group" onclick="selectOuter(8)" id="outer-8">
                    <path class="ring-path" d="M -127.28 127.28 A 180 180 0 0 1 -173.88 46.56 L -202.87 54.32 A 210 210 0 0 0 -148.49 148.49 Z" />
                    <text class="outer-text" x="-167" y="100">申</text>
                </g>
                <g class="outer-group" onclick="selectOuter(9)" id="outer-9">
                    <path class="ring-path" d="M -173.88 46.56 A 180 180 0 0 1 -173.88 -46.56 L -202.87 -54.32 A 210 210 0 0 0 -202.87 54.32 Z" />
                    <text class="outer-text" x="-194" y="0">酉</text>
                </g>
                <g class="outer-group" onclick="selectOuter(10)" id="outer-10">
                    <path class="ring-path" d="M -173.88 -46.56 A 180 180 0 0 1 -127.28 -127.28 L -148.49 -148.49 A 210 210 0 0 0 -202.87 -54.32 Z" />
                    <text class="outer-text" x="-167" y="-100">戌</text>
                </g>
                <g class="outer-group" onclick="selectOuter(11)" id="outer-11">
                    <path class="ring-path" d="M -127.28 -127.28 A 180 180 0 0 1 -46.56 -173.88 L -54.32 -202.87 A 210 210 0 0 0 -148.49 -148.49 Z" />
                    <text class="outer-text" x="-100" y="-170">亥</text>
                </g>
            </g>

        </svg>
    </div>

    <!-- 下方賽博靈能解碼序列面板 (彈性輸入) -->
    <div class="decoder-panel">
        <div class="decoder-title">【 靈能解碼序列 (任意填寫 1-9) 】</div>
        <div class="decoder-inputs" id="decoder-container">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
            <input type="number" min="1" max="9" placeholder="">
        </div>
        <button class="decoder-btn" onclick="calculateDecoderSequence()">動態序列推算</button>
    </div>

    <script>
        const liurenData = [
            { name: "留連", type: "unlucky", desc: "主未詳，事難成 (平/凶)" },
            { name: "速喜", type: "lucky", desc: "人便至，喜訊到 (大吉)" },
            { name: "赤口", type: "unlucky", desc: "主口舌，官司爭 (凶)" },
            { name: "小吉", type: "lucky", desc: "人來喜，謀事通 (吉)" },
            { name: "空亡", type: "unlucky", desc: "音信稀，事不順 (凶)" },
            { name: "大安", type: "lucky", desc: "身安穩，萬事吉 (大吉)" }
        ];

        const branchNames = ["子時", "丑時", "寅時", "卯時", "辰時", "巳時", "午時", "未時", "申時", "酉時", "戌時", "亥時"];
        let currentHourlyResults = [];

        function updateCenterPanel(title, desc, type) {
            let panel = document.getElementById('center-info-box');
            document.getElementById('center-title').innerText = title;
            document.getElementById('center-desc').innerText = desc;

            panel.className = "center-panel";
            if (type === 'lucky') {
                panel.classList.add('panel-lucky');
            } else if (type === 'unlucky') {
                panel.classList.add('panel-unlucky');
            }
        }

        function selectInner(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`inner-${i}`).classList.remove('active');
            }
            document.getElementById(`inner-${index}`).classList.add('active');
            
            let info = liurenData[index];
            updateCenterPanel(info.name, info.desc, info.type);
        }

        function selectOuter(index) {
            for (let i = 0; i < 12; i++) {
                document.getElementById(`outer-${i}`).classList.remove('active');
            }
            document.getElementById(`outer-${index}`).classList.add('active');

            if (currentHourlyResults.length > 0) {
                let liurenIndex = currentHourlyResults[index];
                let info = liurenData[liurenIndex];

                for (let i = 0; i < 6; i++) {
                    document.getElementById(`inner-${i}`).classList.remove('active');
                }
                document.getElementById(`inner-${liurenIndex}`).classList.add('active');

                updateCenterPanel(`${branchNames[index]}：${info.name}`, info.desc, info.type);
            } else {
                updateCenterPanel(branchNames[index], "請先進行排盤", "");
            }
        }

        function calculateLiuren() {
            let month = parseInt(document.getElementById('lunar-month').value);
            let day = parseInt(document.getElementById('lunar-day').value);

            if (isNaN(month) || isNaN(day) || month < 1 || month > 12 || day < 1 || day > 30) {
                alert("請輸入有效的農曆月份 (1-12) 與日期 (1-30)");
                return;
            }

            let monthLanding = (5 + (month - 1)) % 6;
            let dayLanding = (monthLanding + (day - 1)) % 6;

            currentHourlyResults = [];

            for (let hour = 1; hour <= 12; hour++) {
                let finalLanding = (dayLanding + (hour - 1)) % 6;
                currentHourlyResults.push(finalLanding);
            }

            selectOuter(0);
        }

        // 彈性序列推算邏輯：自動抓取所有有填寫的格子，依序累加推演
        function calculateDecoderSequence() {
            let inputs = document.getElementById('decoder-container').getElementsByTagName('input');
            let sequenceValues = [];

            for (let i = 0; i < inputs.length; i++) {
                let valStr = inputs[i].value.trim();
                if (valStr !== "") {
                    let val = parseInt(valStr);
                    if (isNaN(val) || val < 1 || val > 9) {
                        alert(`第 ${i + 1} 格輸入有誤，請填入 1 到 9 之間的數字`);
                        return;
                    }
                    sequenceValues.push(val);
                }
            }

            if (sequenceValues.length === 0) {
                alert("請至少在任意格子中填入一個數字 (1-9)");
                return;
            }

            currentHourlyResults = [];
            let currentAccumulator = 0;

            // 依據實際有填寫的數字序列，對 12 個時辰依序循環加總取模
            for (let hour = 0; hour < 12; hour++) {
                currentAccumulator += sequenceValues[hour % sequenceValues.length];
                let finalLanding = currentAccumulator % 6;
                currentHourlyResults.push(finalLanding);
            }

            selectOuter(0);
        }
    </script>
</body>
</html>
