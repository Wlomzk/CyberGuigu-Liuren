<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 雙環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 380px;
            height: 380px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .palace-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .palace-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        .palace-group.active .palace-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 內環文字樣式（完全保留你的原始座標與結構） */
        .palace-text {
            fill: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .palace-group.active .palace-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }

        /* 外環十二地支文字樣式 */
        .outer-text {
            fill: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="0 0 300 300">
        <!-- ================= 內環六宮 (完全保留你的原始程式碼) ================= -->
        
        <!-- 01. 大安 (-120° ~ -60° | 頂部水平排列) -->
        <g class="palace-group" onclick="selectPalace(0)" id="group-0">
            <path class="palace-path" d="M 115 89.38 L 85 37.42 A 130 130 0 0 1 215 37.42 L 185 89.38 A 70 70 0 0 0 115 89.38 Z" />
            <text class="palace-text" x="150" y="53">大 安</text>
        </g>

        <!-- 02. 留連 (-60° ~ 0° | 右上側直向排列) -->
        <g class="palace-group" onclick="selectPalace(1)" id="group-1">
            <path class="palace-path" d="M 185 89.38 L 215 37.42 A 130 130 0 0 1 280 150 L 220 150 A 70 70 0 0 0 185 89.38 Z" />
            <text class="palace-text" x="235" y="105">
                <tspan x="230" dy="-15">留</tspan>
                <tspan x="245" dy="30">連</tspan>
            </text>
        </g>

        <!-- 03. 速喜 (0° ~ 60° | 右下側直向排列) -->
        <g class="palace-group" onclick="selectPalace(2)" id="group-2">
            <path class="palace-path" d="M 220 150 L 280 150 A 130 130 0 0 1 215 262.58 L 185 210.62 A 70 70 0 0 0 220 150 Z" />
            <text class="palace-text" x="235" y="195">
                <tspan x="245" dy="-12">速</tspan>
                <tspan x="225" dy="33">喜</tspan>
            </text>
        </g>

        <!-- 04. 赤口 (60° ~ 120° | 底部水平排列) -->
        <g class="palace-group" onclick="selectPalace(3)" id="group-3">
            <path class="palace-path" d="M 185 210.62 L 215 262.58 A 130 130 0 0 1 85 262.58 L 115 210.62 A 70 70 0 0 0 185 210.62 Z" />
            <text class="palace-text" x="150" y="250">赤 口</text>
        </g>

        <!-- 05. 小吉 (120° ~ 180° | 左下側直向排列) -->
        <g class="palace-group" onclick="selectPalace(4)" id="group-4">
            <path class="palace-path" d="M 115 210.62 L 85 262.58 A 130 130 0 0 1 20 150 L 80 150 A 70 70 0 0 0 115 210.62 Z" />
            <text class="palace-text" x="65" y="195">
                <tspan x="60" dy="-12">小</tspan>
                <tspan x="70" dy="33">吉</tspan>
            </text>
        </g>

        <!-- 06. 空亡 (180° ~ 240° | 左上側直向排列) -->
        <g class="palace-group" onclick="selectPalace(5)" id="group-5">
            <path class="palace-path" d="M 80 150 L 20 150 A 130 130 0 0 1 85 37.42 L 115 89.38 A 70 70 0 0 0 80 150 Z" />
            <text class="palace-text" x="65" y="105">
                <tspan x="75" dy="-15">空</tspan>
                <tspan x="60" dy="30">亡</tspan>
            </text>
        </g>


        <!-- ================= 外環十二地支層 (外徑 R=145, 內徑 r=130) ================= -->
        
        <!-- 01. 子 (頂部中間偏右) -->
        <path class="palace-path" d="M 135 18 A 145 145 0 0 1 165 18 L 215 37.42 A 130 130 0 0 1 115 37.42 Z" />
        <text class="outer-text" x="150" y="27">子</text>

        <!-- 02. 丑 -->
        <path class="palace-path" d="M 165 18 A 145 145 0 0 1 207.54 42.46 L 243.21 78.13 A 130 130 0 0 1 215 37.42 Z" />
        <text class="outer-text" x="195" y="47">丑</text>

        <!-- 03. 寅 -->
        <path class="palace-path" d="M 207.54 42.46 A 145 145 0 0 1 232.08 85 L 269.62 110.38 A 130 130 0 0 1 243.21 78.13 Z" />
        <text class="outer-text" x="233" y="79">寅</text>

        <!-- 04. 卯 -->
        <path class="palace-path" d="M 232.08 85 A 145 145 0 0 1 282 135 L 280 150 A 130 130 0 0 1 269.62 110.38 Z" />
        <text class="outer-text" x="261" y="117">卯</text>

        <!-- 05. 辰 -->
        <path class="palace-path" d="M 282 135 A 145 145 0 0 1 232.08 215 L 269.62 189.62 A 130 130 0 0 1 280 150 Z" />
        <text class="outer-text" x="261" y="183">辰</text>

        <!-- 06. 巳 -->
        <path class="palace-path" d="M 232.08 215 A 145 145 0 0 1 207.54 257.54 L 243.21 221.87 A 130 130 0 0 1 269.62 189.62 Z" />
        <text class="outer-text" x="233" y="221">巳</text>

        <!-- 07. 午 (底部中間) -->
        <path class="palace-path" d="M 207.54 257.54 A 145 145 0 0 1 165 282 L 185 262.58 A 130 130 0 0 1 243.21 221.87 Z" />
        <text class="outer-text" x="150" y="273">午</text>

        <!-- 08. 未 -->
        <path class="palace-path" d="M 165 282 A 145 145 0 0 1 135 282 L 115 262.58 A 130 130 0 0 1 185 262.58 Z" />
        <text class="outer-text" x="120" y="273">未</text>

        <!-- 09. 申 -->
        <path class="palace-path" d="M 135 282 A 145 145 0 0 1 92.46 257.54 L 56.79 221.87 A 130 130 0 0 1 115 262.58 Z" />
        <text class="outer-text" x="67" y="221">申</text>

        <!-- 10. 西 -->
        <path class="palace-path" d="M 92.46 257.54 A 145 145 0 0 1 67.92 215 L 30.38 189.62 A 130 130 0 0 1 56.79 221.87 Z" />
        <text class="outer-text" x="39" y="183">西</text>

        <!-- 11. 戌 -->
        <path class="palace-path" d="M 67.92 215 A 145 145 0 0 1 18 165 L 20 150 A 130 130 0 0 1 30.38 189.62 Z" />
        <text class="outer-text" x="39" y="117">戌</text>

        <!-- 12. 亥 -->
        <path class="palace-path" d="M 18 165 A 145 145 0 0 1 135 18 L 115 37.42 A 130 130 0 0 1 20 150 Z" />
        <text class="outer-text" x="67" y="79">亥</text>

    </svg>

    <script>
        function selectPalace(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`group-${i}`).classList.remove('active');
            }
            document.getElementById(`group-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
