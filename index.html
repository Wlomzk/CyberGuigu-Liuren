<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 完美閉環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 
          【尺寸與寬度調整區】
          修改這裡的 width 和 height 即可自由放大縮小整體法陣
        */
        .ring-container {
            width: 340px;
            height: 340px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        /* 扇形區塊基本樣式 */
        .palace-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .palace-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        /* 啟動高亮狀態 */
        .palace-group.active .palace-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 文字樣式 (保持水平、不旋轉) */
        .palace-text {
            fill: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .palace-group.active .palace-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }
    </style>
</head>
<body>

    <!-- 
      使用 viewBox="0 0 300 300"
      中心點為 (150, 150)
      外徑 R = 130, 內徑 r = 70
    -->
    <svg class="ring-container" viewBox="0 0 300 300">
        
        <!-- 01. 大安 (300度 ~ 60度) -->
        <g class="palace-group" onclick="selectPalace(0)" id="group-0">
            <path class="palace-path" d="M 150 150 L 150 20 A 130 130 0 0 1 262.58 215 L 192.74 174.64 A 70 70 0 0 0 150 90 Z" />
            <text class="palace-text" x="150" y="55">大安</text>
        </g>

        <!-- 02. 留連 (60度 ~ 120度) -->
        <g class="palace-group" onclick="selectPalace(1)" id="group-1">
            <path class="palace-path" d="M 150 150 L 262.58 215 A 130 130 0 0 1 150 280 L 150 210 A 70 70 0 0 0 192.74 174.64 Z" />
            <text class="palace-text" x="230" y="150">留連</text>
        </g>

        <!-- 03. 速喜 (120度 ~ 180度) -->
        <g class="palace-group" onclick="selectPalace(2)" id="group-2">
            <path class="palace-path" d="M 150 150 L 150 280 A 130 130 0 0 1 37.42 215 L 107.26 174.64 A 70 70 0 0 0 150 210 Z" />
            <text class="palace-text" x="230" y="210">速喜</text>
        </g>

        <!-- 04. 赤口 (180度 ~ 240度) -->
        <g class="palace-group" onclick="selectPalace(3)" id="group-3">
            <path class="palace-path" d="M 150 150 L 37.42 215 A 130 130 0 0 1 37.42 85 L 107.26 125.36 A 70 70 0 0 0 107.26 174.64 Z" />
            <text class="palace-text" x="150" y="245">赤口</text>
        </g>

        <!-- 05. 小吉 (240度 ~ 300度) -->
        <g class="palace-group" onclick="selectPalace(4)" id="group-4">
            <path class="palace-path" d="M 150 150 L 37.42 85 A 130 130 0 0 1 150 20 L 150 90 A 70 70 0 0 0 107.26 125.36 Z" />
            <text class="palace-text" x="70" y="210">小吉</text>
        </g>

        <!-- 06. 空亡 (300度 ~ 360度) -->
        <g class="palace-group" onclick="selectPalace(5)" id="group-5">
            <path class="palace-path" d="M 150 150 L 150 20 A 130 130 0 0 1 262.58 85 L 192.74 125.36 A 70 70 0 0 0 150 90 Z" />
            <text class="palace-text" x="70" y="150">空亡</text>
        </g>

    </svg>

    <script>
        function selectPalace(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`group-${i}`).classList.remove('active');
            }
            document.getElementById(`group-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
