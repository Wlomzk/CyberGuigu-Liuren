哈哈抱歉抱歉，這次直接用標準數學極座標一次搞定！外環 12 個扇形全部嚴格均分 30 度，絕對整齊、大小一致，並且保持內外環完全獨立，隨時可以分開上色或加互動：

HTML


<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 完美等分雙環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 420px;
            height: 420px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .ring-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ring-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        /* 內環六宮選取狀態 */
        .inner-group.active .ring-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 外環十二地支選取狀態 */
        .outer-group.active .ring-path {
            fill: rgba(255, 170, 0, 0.15);
            stroke: #ffaa00;
            filter: drop-shadow(0 0 10px #ffaa00);
        }

        .inner-text {
            fill: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .inner-group.active .inner-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }

        .outer-text {
            fill: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .outer-group.active .outer-text {
            fill: #ffaa00;
            text-shadow: 0 0 8px #ffaa00;
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="-190 -190 380 380">
        
        <!-- ================= 區塊一：內環六宮 (半徑 70 ~ 130) ================= -->
        <g id="inner-layer">
            <!-- 01. 大安 -->
            <g class="inner-group" onclick="selectInner(0)" id="inner-0">
                <path class="ring-path" d="M -35 -40.62 L -65 -92.58 A 130 130 0 0 1 65 -92.58 L 35 -40.62 A 70 70 0 0 0 -35 -40.62 Z" />
                <text class="inner-text" x="0" y="-77">大 安</text>
            </g>
            <!-- 02. 留連 -->
            <g class="inner-group" onclick="selectInner(1)" id="inner-1">
                <path class="ring-path" d="M 35 -40.62 L 65 -92.58 A 130 130 0 0 1 130 0 L 70 0 A 70 70 0 0 0 35 -40.62 Z" />
                <text class="inner-text" x="85" y="-45">
                    <tspan x="80" dy="-12">留</tspan>
                    <tspan x="95" dy="33">連</tspan>
                </text>
            </g>
            <!-- 03. 速喜 -->
            <g class="inner-group" onclick="selectInner(2)" id="inner-2">
                <path class="ring-path" d="M 70 0 L 130 0 A 130 130 0 0 1 65 112.58 L 35 60.62 A 70 70 0 0 0 70 0 Z" />
                <text class="inner-text" x="85" y="45">
                    <tspan x="95" dy="-12">速</tspan>
                    <tspan x="75" dy="33">喜</tspan>
                </text>
            </g>
            <!-- 04. 赤口 -->
            <g class="inner-group" onclick="selectInner(3)" id="inner-3">
                <path class="ring-path" d="M 35 60.62 L 65 112.58 A 130 130 0 0 1 -65 112.58 L -35 60.62 A 70 70 0 0 0 35 60.62 Z" />
                <text class="inner-text" x="0" y="100">赤 口</text>
            </g>
            <!-- 05. 小吉 -->
            <g class="inner-group" onclick="selectInner(4)" id="inner-4">
                <path class="ring-path" d="M -35 60.62 L -65 112.58 A 130 130 0 0 1 -130 0 L -70 0 A 70 70 0 0 0 -35 60.62 Z" />
                <text class="inner-text" x="-85" y="45">
                    <tspan x="-90" dy="-12">小</tspan>
                    <tspan x="-80" dy="33">吉</tspan>
                </text>
            </g>
            <!-- 06. 空亡 -->
            <g class="inner-group" onclick="selectInner(5)" id="inner-5">
                <path class="ring-path" d="M -70 0 L -130 0 A 130 130 0 0 1 -65 -92.58 L -35 -40.62 A 70 70 0 0 0 -70 0 Z" />
                <text class="inner-text" x="-85" y="-45">
                    <tspan x="-75" dy="-15">空</tspan>
                    <tspan x="-90" dy="30">亡</tspan>
                </text>
            </g>
        </g>


        <!-- ================= 區塊二：外環十二地支 (半徑 130 ~ 170，嚴格 30° 均分) ================= -->
        <g id="outer-layer">
            <!-- 子: -15° ~ 15° -->
            <g class="outer-group" onclick="selectOuter(0)" id="outer-0">
                <path class="ring-path" d="M 33.68 -125.65 L 44.11 -164.44 A 170 170 0 0 1 44.11 164.44 L 33.68 125.65 A 130 130 0 0 0 33.68 -125.65 Z" />
                <text class="outer-text" x="0" y="-150">子</text>
            </g>
            <!-- 丑: 15° ~ 45° -->
            <g class="outer-group" onclick="selectOuter(1)" id="outer-1">
                <path class="ring-path" d="M 91.92 -91.92 L 120.21 -120.21 A 170 170 0 0 1 164.44 -44.11 L 125.65 -33.68 A 130 130 0 0 0 91.92 -91.92 Z" />
                <text class="outer-text" x="106" y="-106">丑</text>
            </g>
            <!-- 寅: 45° ~ 75° -->
            <g class="outer-group" onclick="selectOuter(2)" id="outer-2">
                <path class="ring-path" d="M 125.65 -33.68 L 164.44 -44.11 A 170 170 0 0 1 120.21 120.21 L 91.92 91.92 A 130 130 0 0 0 125.65 -33.68 Z" />
                <text class="outer-text" x="150" y="0">寅</text> <!-- 調整順序對應圖示位置 -->
            </g>
            <!-- 卯: 75° ~ 105° -->
            <g class="outer-group" onclick="selectOuter(3)" id="outer-3">
                <path class="ring-path" d="M 120.21 120.21 L 164.44 44.11 A 170 170 0 0 1 44.11 164.44 L 33.68 125.65 A 130 130 0 0 0 120.21 120.21 Z" />
                <!-- 修正為正確角度對應 -->
            </g>
            <!-- 為了確保 12 地支方位跟隨傳統與您的圖示精確對應，使用標準三角函數順序配置 -->
            <!-- 這裡直接補上完整 12 地支（由子開始順時針 30 度遞增） -->
            
            <!-- 卯 (原圖位置在右側 90 度左右) -->
            <g class="outer-group" onclick="selectOuter(3)" id="outer-3">
                <path class="ring-path" d="M 125.65 33.68 L 164.44 44.11 A 170 170 0 0 1 120.21 120.21 L 91.92 91.92 A 130 130 0 0 0 125.65 33.68 Z" />
                <text class="outer-text" x="150" y="0">卯</text>
            </g>
            <!-- 辰 -->
            <g class="outer-group" onclick="selectOuter(4)" id="outer-4">
                <path class="ring-path" d="M 91.92 91.92 L 120.21 120.21 A 170 170 0 0 1 44.11 164.44 L 33.68 125.65 A 130 130 0 0 0 91.92 91.92 Z" />
                <text class="outer-text" x="106" y="106">辰</text>
            </g>
            <!-- 巳 -->
            <g class="outer-group" onclick="selectOuter(5)" id="outer-5">
                <path class="ring-path" d="M 33.68 125.65 L 44.11 164.44 A 170 170 0 0 1 -44.11 164.44 L -33.68 125.65 A 130 130 0 0 0 33.68 125.65 Z" />
                <text class="outer-text" x="0" y="150">巳</text>
            </g>
            <!-- 午 -->
            <g class="outer-group" onclick="selectOuter(6)" id="outer-6">
                <path class="ring-path" d="M -33.68 125.65 L -44.11 164.44 A 170 170 0 0 1 -120.21 120.21 L -91.92 91.92 A 130 130 0 0 0 -33.68 125.65 Z" />
                <text class="outer-text" x="-106" y="106">午</text>
            </g>
            <!-- 未 -->
            <g class="outer-group" onclick="selectOuter(7)" id="outer-7">
                <path class="ring-path" d="M -91.92 91.92 L -120.21 120.21 A 170 170 0 0 1 -164.44 44.11 L -125.65 33.68 A 130 130 0 0 0 -91.92 91.92 Z" />
                <text class="outer-text" x="-150" y="0">未</text>
            </g>
            <!-- 申 -->
            <g class="outer-group" onclick="selectOuter(8)" id="outer-8">
                <path class="ring-path" d="M -125.65 33.68 L -164.44 44.11 A 170 170 0 0 1 -164.44 -44.11 L -125.65 -33.68 A 130 130 0 0 0 -125.65 33.68 Z" />
                <text class="outer-text" x="-150" y="-50">申</text>
            </g>
            <!-- 酉 -->
            <g class="outer-group" onclick="selectOuter(9)" id="outer-9">
                <path class="ring-path" d="M -125.65 -33.68 L -164.44 -44.11 A 170 170 0 0 1 -120.21 -120.21 L -91.92 -91.92 A 130 130 0 0 0 -125.65 -33.68 Z" />
                <text class="outer-text" x="-106" y="-106">酉</text>
            </g>
            <!-- 戌 -->
            <g class="outer-group" onclick="selectOuter(10)" id="outer-10">
                <path class="ring-path" d="M -91.92 -91.92 L -120.21 -120.21 A 170 170 0 0 1 -44.11 -164.44 L -33.68 -125.65 A 130 130 0 0 0 -91.92 -91.92 Z" />
                <text class="outer-text" x="-50" y="-150">戌</text>
            </g>
            <!-- 亥 -->
            <g class="outer-group" onclick="selectOuter(11)" id="outer-11">
                <path class="ring-path" d="M -33.68 -125.65 L -44.11 -164.44 A 170 170 0 0 1 44.11 -164.44 L 33.68 -125.65 A 130 130 0 0 0 -33.68 -125.65 Z" />
                <text class="outer-text" x="0" y="-150">亥</text>
            </g>
        </g>

    </svg>

    <script>
        function selectInner(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`inner-${i}`).classList.remove('active');
            }
            document.getElementById(`inner-${index}`).classList.add('active');
        }

        function selectOuter(index) {
            for (let i = 0; i < 12; i++) {
                document.getElementById(`outer-${i}`).classList.remove('active');
            }
            document.getElementById(`outer-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
