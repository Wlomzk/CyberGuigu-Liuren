<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 精準錯位法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 340px;
            height: 340px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .palace-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .palace-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        .palace-group.active .palace-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        .palace-text {
            fill: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .palace-group.active .palace-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="0 0 300 300">
        
        <!-- 01. 大安 (上方：橫向微錯位) -->
        <g class="palace-group" onclick="selectPalace(0)" id="group-0">
            <path class="palace-path" d="M 150 150 L 150 20 A 130 130 0 0 1 225.26 45.36 L 180.18 102.68 A 70 70 0 0 0 150 90 Z" />
            <text class="palace-text" x="150" y="52">
                <tspan x="142" dy="0">大</tspan>
                <tspan x="158" dy="0">安</tspan>
            </text>
        </g>

        <!-- 02. 留連 (右上方：縱向順著圓弧) -->
        <g class="palace-group" onclick="selectPalace(1)" id="group-1">
            <path class="palace-path" d="M 150 150 L 225.26 45.36 A 130 130 0 0 1 280 150 L 210 150 A 70 70 0 0 0 180.18 102.68 Z" />
            <text class="palace-text" x="222" y="98">
                <tspan x="218" dy="-6">留</tspan>
                <tspan x="226" dy="12">連</tspan>
            </text>
        </g>

        <!-- 03. 速喜 (右下方) -->
        <g class="palace-group" onclick="selectPalace(2)" id="group-2">
            <path class="palace-path" d="M 150 150 L 280 150 A 130 130 0 0 1 225.26 254.64 L 180.18 197.32 A 70 70 0 0 0 210 150 Z" />
            <text class="palace-text" x="222" y="202">
                <tspan x="218" dy="-6">速</tspan>
                <tspan x="226" dy="12">喜</tspan>
            </text>
        </g>

        <!-- 04. 赤口 (下方) -->
        <g class="palace-group" onclick="selectPalace(3)" id="group-3">
            <path class="palace-path" d="M 150 150 L 225.26 254.64 A 130 130 0 0 1 74.74 254.64 L 119.82 197.32 A 70 70 0 0 0 180.18 197.32 Z" />
            <text class="palace-text" x="150" y="248">
                <tspan x="142" dy="0">赤</tspan>
                <tspan x="158" dy="0">口</tspan>
            </text>
        </g>

        <!-- 05. 小吉 (左下方) -->
        <g class="palace-group" onclick="selectPalace(4)" id="group-4">
            <path class="palace-path" d="M 150 150 L 74.74 254.64 A 130 130 0 0 1 20 150 L 90 150 A 70 70 0 0 0 119.82 197.32 Z" />
            <text class="palace-text" x="78" y="202">
                <tspan x="82" dy="-6">小</tspan>
                <tspan x="74" dy="12">吉</tspan>
            </text>
        </g>

        <!-- 06. 空亡 (左上方：空偏下、亡偏上) -->
        <g class="palace-group" onclick="selectPalace(5)" id="group-5">
            <path class="palace-path" d="M 150 150 L 20 150 A 130 130 0 0 1 74.74 45.36 L 119.82 102.68 A 70 70 0 0 0 90 150 Z" />
            <text class="palace-text" x="78" y="98">
                <tspan x="82" dy="-6">空</tspan>
                <tspan x="74" dy="12">亡</tspan>
            </text>
        </g>

    </svg>

    <script>
        function selectPalace(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`group-${i}`).classList.remove('active');
            }
            document.getElementById(`group-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
