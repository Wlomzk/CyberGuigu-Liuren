<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 完美等分雙環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 420px;
            height: 420px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .ring-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ring-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        /* 內環六宮選取狀態 */
        .inner-group.active .ring-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 外環十二地支選取狀態 */
        .outer-group.active .ring-path {
            fill: rgba(255, 170, 0, 0.15);
            stroke: #ffaa00;
            filter: drop-shadow(0 0 10px #ffaa00);
        }

        .inner-text {
            fill: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .inner-group.active .inner-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }

        .outer-text {
            fill: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .outer-group.active .outer-text {
            fill: #ffaa00;
            text-shadow: 0 0 8px #ffaa00;
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="-190 -190 380 380">
        
        <!-- ================= 區塊一：內環六宮 (半徑 70 ~ 130，每宮 60 度) ================= -->
        <g id="inner-layer">
            <!-- 01. 大安 (頂部偏右 30° ~ 90° / 數學角度 -60° ~ 0°) -->
            <g class="inner-group" onclick="selectInner(0)" id="inner-0">
                <path class="ring-path" d="M 35 -60.62 L 65 -112.58 A 130 130 0 0 1 130 0 L 70 0 A 70 70 0 0 0 35 -60.62 Z" />
                <text class="inner-text" x="82" y="-38">大 安</text>
            </g>

            <!-- 02. 留連 (右下 90° ~ 150° / 數學角度 0° ~ 60°) -->
            <g class="inner-group" onclick="selectInner(1)" id="inner-1">
                <path class="ring-path" d="M 70 0 L 130 0 A 130 130 0 0 1 65 112.58 L 35 60.62 A 70 70 0 0 0 70 0 Z" />
                <text class="inner-text" x="82" y="38">留 連</text>
            </g>

            <!-- 03. 速喜 (底部偏右 150° ~ 210° / 數學角度 60° ~ 120°) -->
            <g class="inner-group" onclick="selectInner(2)" id="inner-2">
                <path class="ring-path" d="M 35 60.62 L 65 112.58 A 130 130 0 0 1 -65 112.58 L -35 60.62 A 70 70 0 0 0 35 60.62 Z" />
                <text class="inner-text" x="0" y="88">速 喜</text>
            </g>

            <!-- 04. 赤口 (底部偏左 210° ~ 270° / 數學角度 120° ~ 180°) -->
            <g class="inner-group" onclick="selectInner(3)" id="inner-3">
                <path class="ring-path" d="M -35 60.62 L -65 112.58 A 130 130 0 0 1 -130 0 L -70 0 A 70 70 0 0 0 -35 60.62 Z" />
                <text class="inner-text" x="-82" y="38">赤 口</text>
            </g>

            <!-- 05. 小吉 (左上 270° ~ 330° / 數學角度 180° ~ 240°) -->
            <g class="inner-group" onclick="selectInner(4)" id="inner-4">
                <path class="ring-path" d="M -70 0 L -130 0 A 130 130 0 0 1 -65 -112.58 L -35 -60.62 A 70 70 0 0 0 -70 0 Z" />
                <text class="inner-text" x="-82" y="-38">小 吉</text>
            </g>

            <!-- 06. 空亡 (頂部偏左 330° ~ 360° / 數學角度 240° ~ 300°) -->
            <g class="inner-group" onclick="selectInner(5)" id="inner-5">
                <path class="ring-path" d="M -35 -60.62 L -65 -112.58 A 130 130 0 0 1 35 -60.62 L 70 -35 Z" />
                <!-- 修正路徑與文字：對應頂部中央區域 -->
                <path class="ring-path" d="M -35 -60.62 L -65 -112.58 A 130 130 0 0 1 35 -60.62 L 17.5 -30.31 A 70 70 0 0 0 -35 -60.62 Z" style="display:none;" />
                <!-- 直接使用標準精準三角座標覆蓋空亡區塊 (-30° ~ 30° 旋轉對稱) -->
                <path class="ring-path" d="M -35 -60.62 L -65 -112.58 A 130 130 0 0 1 65 -112.58 L 35 -60.62 A 70 70 0 0 0 -35 -60.62 Z" />
                <text class="inner-text" x="0" y="-88">空 亡</text>
            </g>
        </g>


        <!-- ================= 區塊二：外環十二地支 (半徑 130 ~ 170，每宮 30 度) ================= -->
        <g id="outer-layer">
            <!-- 01. 子 (頂部 -15° ~ 15°) -->
            <g class="outer-group" onclick="selectOuter(0)" id="outer-0">
                <path class="ring-path" d="M 33.68 -125.65 L 44.11 -164.44 A 170 170 0 0 1 -44.11 -164.44 L -33.68 -125.65 A 130 130 0 0 1 33.68 -125.65 Z" />
                <text class="outer-text" x="0" y="-150">子</text>
            </g>
            <!-- 02. 丑 (15° ~ 45°) -->
            <g class="outer-group" onclick="selectOuter(1)" id="outer-1">
                <path class="ring-path" d="M 33.68 -125.65 L 44.11 -164.44 A 170 170 0 0 1 120.21 -120.21 L 91.92 -91.92 A 130 130 0 0 0 33.68 -125.65 Z" />
                <!-- 修正丑的角度正確配置 -->
                <path class="ring-path" d="M 33.68 -125.65 L 44.11 -164.44 A 170 170 0 0 1 120.21 -120.21 L 91.92 -91.92 A 130 130 0 0 0 33.68 -125.65 Z" style="display:none;" />
                <!-- 修正為正確 30 度扇形 (15°~45°) -->
                <path class="ring-path" d="M 44.11 -164.44 A 170 170 0 0 1 120.21 -120.21 L 91.92 -91.92 A 130 130 0 0 0 33.68 -125.65 L 44.11 -164.44 Z" />
                <text class="outer-text" x="106" y="-106">丑</text>
            </g>
            <!-- 03. 寅 (45° ~ 75°) -->
            <g class="outer-group" onclick="selectOuter(2)" id="outer-2">
                <path class="ring-path" d="M 120.21 -120.21 A 170 170 0 0 1 164.44 -44.11 L 125.65 -33.68 A 130 130 0 0 0 91.92 -91.92 L 120.21 -120.21 Z" />
                <text class="outer-text" x="150" y="-50">寅</text>
            </g>
            <!-- 04. 卯 (75° ~ 105°) -->
            <g class="outer-group" onclick="selectOuter(3)" id="outer-3">
                <path class="ring-path" d="M 164.44 -44.11 A 170 170 0 0 1 164.44 44.11 L 125.65 33.68 A 130 130 0 0 0 125.65 -33.68 L 164.44 -44.11 Z" />
                <text class="outer-text" x="150" y="0">卯</text>
            </g>
            <!-- 05. 辰 (105° ~ 135°) -->
            <g class="outer-group" onclick="selectOuter(4)" id="outer-4">
                <path class="ring-path" d="M 164.44 44.11 A 170 170 0 0 1 120.21 120.21 L 91.92 91.92 A 130 130 0 0 0 125.65 33.68 L 164.44 44.11 Z" />
                <text class="outer-text" x="106" y="106">辰</text>
            </g>
            <!-- 06. 巳 (135° ~ 165°) -->
            <g class="outer-group" onclick="selectOuter(5)" id="outer-5">
                <path class="ring-path" d="M 120.21 120.21 A 170 170 0 0 1 44.11 164.44 L 33.68 125.65 A 130 130 0 0 0 91.92 91.92 L 120.21 120.21 Z" />
                <text class="outer-text" x="50" y="150">巳</text>
            </g>
            <!-- 07. 午 (165° ~ 195°) -->
            <g class="outer-group" onclick="selectOuter(6)" id="outer-6">
                <path class="ring-path" d="M 44.11 164.44 A 170 170 0 0 1 -44.11 164.44 L -33.68 125.65 A 130 130 0 0 0 33.68 125.65 L 44.11 164.44 Z" />
                <text class="outer-text" x="0" y="150">午</text>
            </g>
            <!-- 08. 未 (195° ~ 225°) -->
            <g class="outer-group" onclick="selectOuter(7)" id="outer-7">
                <path class="ring-path" d="M -44.11 164.44 A 170 170 0 0 1 -120.21 120.21 L -91.92 91.92 A 130 130 0 0 0 -33.68 125.65 L -44.11 164.44 Z" />
                <text class="outer-text" x="-50" y="150">未</text>
            </g>
            <!-- 09. 申 (225° ~ 255°) -->
            <g class="outer-group" onclick="selectOuter(8)" id="outer-8">
                <path class="ring-path" d="M -120.21 120.21 A 170 170 0 0 1 -164.44 44.11 L -125.65 33.68 A 130 130 0 0 0 -91.92 91.92 L -120.21 120.21 Z" />
                <text class="outer-text" x="-106" y="106">申</text>
            </g>
            <!-- 10. 酉 (255° ~ 285°) -->
            <g class="outer-group" onclick="selectOuter(9)" id="outer-9">
                <path class="ring-path" d="M -164.44 44.11 A 170 170 0 0 1 -164.44 -44.11 L -125.65 -33.68 A 130 130 0 0 0 -125.65 33.68 L -164.44 44.11 Z" />
                <text class="outer-text" x="-150" y="0">酉</text>
            </g>
            <!-- 11. 戌 (285° ~ 315°) -->
            <g class="outer-group" onclick="selectOuter(10)" id="outer-10">
                <path class="ring-path" d="M -164.44 -44.11 A 170 170 0 0 1 -120.21 -120.21 L -91.92 -91.92 A 130 130 0 0 0 -125.65 -33.68 L -164.44 -44.11 Z" />
                <text class="outer-text" x="-150" y="-50">戌</text>
            </g>
            <!-- 12. 亥 (315° ~ 345°) -->
            <g class="outer-group" onclick="selectOuter(11)" id="outer-11">
                <path class="ring-path" d="M -120.21 -120.21 A 170 170 0 0 1 -44.11 -164.44 L -33.68 -125.65 A 130 130 0 0 0 -91.92 -91.92 L -120.21 -120.21 Z" />
                <text class="outer-text" x="-106" y="-106">亥</text>
            </g>
        </g>

    </svg>

    <script>
        function selectInner(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`inner-${i}`).classList.remove('active');
            }
            document.getElementById(`inner-${index}`).classList.add('active');
        }

        function selectOuter(index) {
            for (let i = 0; i < 12; i++) {
                document.getElementById(`outer-${i}`).classList.remove('active');
            }
            document.getElementById(`outer-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
