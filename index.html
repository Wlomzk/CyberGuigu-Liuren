<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 完美閉環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 340px;
            height: 340px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .palace-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .palace-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        .palace-group.active .palace-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        .palace-text {
            fill: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .palace-group.active .palace-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="0 0 300 300">
        <!-- 
          中心點 (150, 150), 外徑 R = 130, 內徑 r = 70
          涵蓋 6 個完美 60 度閉環扇形
        -->

        <!-- 01. 大安 (-30° ~ 30°) -->
        <g class="palace-group" onclick="selectPalace(0)" id="group-0">
            <path class="palace-path" d="M 115 89.38 L 85 37.42 A 130 130 0 0 1 215 37.42 L 185 89.38 A 70 70 0 0 0 115 89.38 Z" />
            <text class="palace-text" x="150" y="55">大安</text>
        </g>

        <!-- 02. 留連 (30° ~ 90°) -->
        <g class="palace-group" onclick="selectPalace(1)" id="group-1">
            <path class="palace-path" d="M 185 89.38 L 215 37.42 A 130 130 0 0 1 262.58 135 L 210.62 135 A 70 70 0 0 0 185 89.38 Z" />
            <text class="palace-text" x="225" y="100">留連</text>
        </g>

        <!-- 03. 速喜 (90° ~ 150°) -->
        <g class="palace-group" onclick="selectPalace(2)" id="group-2">
            <path class="palace-path" d="M 210.62 165 L 262.58 165 A 130 130 0 0 1 215 262.58 L 185 210.62 A 70 70 0 0 0 210.62 165 Z" />
            <text class="palace-text" x="225" y="200">速喜</text>
        </g>

        <!-- 04. 赤口 (150° ~ 210°) -->
        <g class="palace-group" onclick="selectPalace(3)" id="group-3">
            <path class="palace-path" d="M 185 210.62 L 215 262.58 A 130 130 0 0 1 85 262.58 L 115 210.62 A 70 70 0 0 0 185 210.62 Z" />
            <text class="palace-text" x="150" y="245">赤口</text>
        </g>

        <!-- 05. 小吉 (210° ~ 270°) -->
        <g class="palace-group" onclick="selectPalace(4)" id="group-4">
            <path class="palace-path" d="M 115 210.62 L 85 262.58 A 130 130 0 0 1 37.42 165 L 89.38 165 A 70 70 0 0 0 115 210.62 Z" />
            <text class="palace-text" x="75" y="200">小吉</text>
        </g>

        <!-- 06. 空亡 (270° ~ 330°：依需求做微幅直排錯位) -->
        <g class="palace-group" onclick="selectPalace(5)" id="group-5">
            <path class="palace-path" d="M 89.38 135 L 37.42 135 A 130 130 0 0 1 85 37.42 L 115 89.38 A 70 70 0 0 0 89.38 135 Z" />
            <text class="palace-text" x="75" y="100">
                <tspan x="75" dy="-6">空</tspan>
                <tspan x="75" dy="14">亡</tspan>
            </text>
        </g>
    </svg>

    <script>
        function selectPalace(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`group-${i}`).classList.remove('active');
            }
            document.getElementById(`group-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
