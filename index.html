<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 雙環分離法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 400px;
            height: 400px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        /* 共通環狀區塊基本樣式 */
        .ring-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ring-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        /* 內環選取狀態樣式 */
        .inner-group.active .ring-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 外環選取狀態樣式（獨立類別，方便未來分別上色） */
        .outer-group.active .ring-path {
            fill: rgba(255, 170, 0, 0.15);
            stroke: #ffaa00;
            filter: drop-shadow(0 0 10px #ffaa00);
        }

        /* 內環文字（完全保留你的原始座標） */
        .inner-text {
            fill: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .inner-group.active .inner-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }

        /* 外環十二地支文字 */
        .outer-text {
            fill: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .outer-group.active .outer-text {
            fill: #ffaa00;
            text-shadow: 0 0 8px #ffaa00;
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="-180 -180 360 360">
        
        <!-- ================= 區塊一：內環六宮 (半徑 70 ~ 130) ================= -->
        <g id="inner-layer" transform="translate(0, 0)">
            <!-- 01. 大安 -->
            <g class="inner-group" onclick="selectInner(0)" id="inner-0">
                <path class="ring-path" d="M -35 -40.62 L -65 -92.58 A 130 130 0 0 1 65 -92.58 L 35 -40.62 A 70 70 0 0 0 -35 -40.62 Z" />
                <text class="inner-text" x="0" y="-77">大 安</text>
            </g>

            <!-- 02. 留連 -->
            <g class="inner-group" onclick="selectInner(1)" id="inner-1">
                <path class="ring-path" d="M 35 -40.62 L 65 -92.58 A 130 130 0 0 1 130 0 L 70 0 A 70 70 0 0 0 35 -40.62 Z" />
                <text class="inner-text" x="85" y="-45">
                    <tspan x="80" dy="-12">留</tspan>
                    <tspan x="95" dy="33">連</tspan>
                </text>
            </g>

            <!-- 03. 速喜 -->
            <g class="inner-group" onclick="selectInner(2)" id="inner-2">
                <path class="ring-path" d="M 70 0 L 130 0 A 130 130 0 0 1 65 112.58 L 35 60.62 A 70 70 0 0 0 70 0 Z" />
                <text class="inner-text" x="85" y="45">
                    <tspan x="95" dy="-12">速</tspan>
                    <tspan x="75" dy="33">喜</tspan>
                </text>
            </g>

            <!-- 04. 赤口 -->
            <g class="inner-group" onclick="selectInner(3)" id="inner-3">
                <path class="ring-path" d="M 35 60.62 L 65 112.58 A 130 130 0 0 1 -65 112.58 L -35 60.62 A 70 70 0 0 0 35 60.62 Z" />
                <text class="inner-text" x="0" y="100">赤 口</text>
            </g>

            <!-- 05. 小吉 -->
            <g class="inner-group" onclick="selectInner(4)" id="inner-4">
                <path class="ring-path" d="M -35 60.62 L -65 112.58 A 130 130 0 0 1 -130 0 L -70 0 A 70 70 0 0 0 -35 60.62 Z" />
                <text class="inner-text" x="-85" y="45">
                    <tspan x="-90" dy="-12">小</tspan>
                    <tspan x="-80" dy="33">吉</tspan>
                </text>
            </g>

            <!-- 06. 空亡 -->
            <g class="inner-group" onclick="selectInner(5)" id="inner-5">
                <path class="ring-path" d="M -70 0 L -130 0 A 130 130 0 0 1 -65 -92.58 L -35 -40.62 A 70 70 0 0 0 -70 0 Z" />
                <text class="inner-text" x="-85" y="-45">
                    <tspan x="-75" dy="-15">空</tspan>
                    <tspan x="-90" dy="30">亡</tspan>
                </text>
            </g>
        </g>


        <!-- ================= 區塊二：外環十二地支 (半徑 130 ~ 160) ================= -->
        <g id="outer-layer" transform="translate(0, 0)">
            <!-- 12地支依 30 度等分環繞，內徑 130，外徑 160 -->
            <!-- 範例設置子、丑、寅...等 12 個區塊 -->
            <g class="outer-group" onclick="selectOuter(0)" id="outer-0">
                <path class="ring-path" d="M -41.57 -122.07 L -51.2 -150.2 A 160 160 0 0 1 51.2 -150.2 L 41.57 -122.07 A 130 130 0 0 0 -41.57 -122.07 Z" />
                <text class="outer-text" x="0" y="-138">子</text>
            </g>
            <g class="outer-group" onclick="selectOuter(1)" id="outer-1">
                <path class="ring-path" d="M 41.57 -122.07 L 51.2 -150.2 A 160 160 0 0 1 122.07 -102.68 L 99.28 -83.47 A 130 130 0 0 0 41.57 -122.07 Z" />
                <text class="outer-text" x="78" y="-120">丑</text>
            </g>
            <g class="outer-group" onclick="selectOuter(2)" id="outer-2">
                <path class="ring-path" d="M 99.28 -83.47 L 122.07 -102.68 A 160 160 0 0 1 150.2 -51.2 L 122.07 -41.57 A 130 130 0 0 0 99.28 -83.47 Z" />
                <text class="outer-text" x="123" y="-78">寅</text>
            </g>
            <g class="outer-group" onclick="selectOuter(3)" id="outer-3">
                <path class="ring-path" d="M 122.07 -41.57 L 150.2 -51.2 A 160 160 0 0 1 150.2 51.2 L 122.07 41.57 A 130 130 0 0 0 122.07 -41.57 Z" />
                <text class="outer-text" x="138" y="0">卯</text>
            </g>
            <g class="outer-group" onclick="selectOuter(4)" id="outer-4">
                <path class="ring-path" d="M 122.07 41.57 L 150.2 51.2 A 160 160 0 0 1 122.07 102.68 L 99.28 83.47 A 130 130 0 0 0 122.07 41.57 Z" />
                <text class="outer-text" x="123" y="78">辰</text>
            </g>
            <g class="outer-group" onclick="selectOuter(5)" id="outer-5">
                <path class="ring-path" d="M 99.28 83.47 L 122.07 102.68 A 160 160 0 0 1 51.2 150.2 L 41.57 122.07 A 130 130 0 0 0 99.28 83.47 Z" />
                <text class="outer-text" x="78" y="120">巳</text>
            </g>
            <g class="outer-group" onclick="selectOuter(6)" id="outer-6">
                <path class="ring-path" d="M 41.57 122.07 L 51.2 150.2 A 160 160 0 0 1 -51.2 150.2 L -41.57 122.07 A 130 130 0 0 0 41.57 122.07 Z" />
                <text class="outer-text" x="0" y="138">午</text>
            </g>
            <g class="outer-group" onclick="selectOuter(7)" id="outer-7">
                <path class="ring-path" d="M -41.57 122.07 L -51.2 150.2 A 160 160 0 0 1 -122.07 102.68 L -99.28 83.47 A 130 130 0 0 0 -41.57 122.07 Z" />
                <text class="outer-text" x="-78" y="120">未</text>
            </g>
            <g class="outer-group" onclick="selectOuter(8)" id="outer-8">
                <path class="ring-path" d="M -99.28 83.47 L -122.07 102.68 A 160 160 0 0 1 -150.2 51.2 L -122.07 41.57 A 130 130 0 0 0 -99.28 83.47 Z" />
                <text class="outer-text" x="-123" y="78">申</text>
            </g>
            <g class="outer-group" onclick="selectOuter(9)" id="outer-9">
                <path class="ring-path" d="M -122.07 41.57 L -150.2 51.2 A 160 160 0 0 1 -150.2 -51.2 L -122.07 -41.57 A 130 130 0 0 0 -122.07 41.57 Z" />
                <text class="outer-text" x="-138" y="0">酉</text>
            </g>
            <g class="outer-group" onclick="selectOuter(10)" id="outer-10">
                <path class="ring-path" d="M -122.07 -41.57 L -150.2 -51.2 A 160 160 0 0 1 -122.07 -102.68 L -99.28 -83.47 A 130 130 0 0 0 -122.07 -41.57 Z" />
                <text class="outer-text" x="-123" y="-78">戌</text>
            </g>
            <g class="outer-group" onclick="selectOuter(11)" id="outer-11">
                <path class="ring-path" d="M -99.28 -83.47 L -122.07 -102.68 A 160 160 0 0 1 -51.2 -150.2 L -41.57 -122.07 A 130 130 0 0 0 -99.28 -83.47 Z" />
                <text class="outer-text" x="-78" y="-120">亥</text>
            </g>
        </g>

    </svg>

    <script>
        // 內環選取邏輯（互斥）
        function selectInner(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`inner-${i}`).classList.remove('active');
            }
            document.getElementById(`inner-${index}`).classList.add('active');
        }

        // 外環選取邏輯（獨立運作，互不干擾）
        function selectOuter(index) {
            for (let i = 0; i < 12; i++) {
                document.getElementById(`outer-${i}`).classList.remove('active');
            }
            document.getElementById(`outer-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
