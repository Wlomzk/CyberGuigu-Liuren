<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuigu-Liuren | 錯位圓環法陣</title>
    <style>
        :root {
            --bg-deep: #070605;
            --ring-bg: #16120e;
            --ring-border: #523e2d;
            --patina-glow: #00ffaa;
            --text-color: #bfa381;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-deep);
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ring-container {
            width: 340px;
            height: 340px;
            filter: drop-shadow(0 0 25px rgba(0, 0, 0, 0.9));
        }

        .palace-path {
            fill: var(--ring-bg);
            stroke: var(--ring-border);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .palace-path:hover {
            fill: #221a14;
            stroke: var(--patina-glow);
        }

        .palace-group.active .palace-path {
            fill: rgba(0, 255, 170, 0.15);
            stroke: var(--patina-glow);
            filter: drop-shadow(0 0 10px var(--patina-glow));
        }

        /* 文字基礎樣式 */
        .palace-text {
            fill: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            transition: fill 0.3s ease;
        }

        .palace-group.active .palace-text {
            fill: var(--patina-glow);
            text-shadow: 0 0 8px var(--patina-glow);
        }
    </style>
</head>
<body>

    <svg class="ring-container" viewBox="0 0 300 300">
        
        <!-- 01. 大安 (上方：左右微錯位) -->
        <g class="palace-group" onclick="selectPalace(0)" id="group-0">
            <path class="palace-path" d="M 150 150 L 150 20 A 130 130 0 0 1 262.58 85 L 192.74 125.36 A 70 70 0 0 0 150 90 Z" />
            <text class="palace-text" x="150" y="55">
                <tspan dx="-4" dy="3">大</tspan>
                <tspan dx="4" dy="-3">安</tspan>
            </text>
        </g>

        <!-- 02. 留連 (右上方：斜向錯位) -->
        <g class="palace-group" onclick="selectPalace(1)" id="group-1">
            <path class="palace-path" d="M 150 150 L 262.58 85 A 130 130 0 0 1 262.58 215 L 192.74 174.64 A 70 70 0 0 0 192.74 125.36 Z" />
            <text class="palace-text" x="225" y="150">
                <tspan dx="0" dy="-6">留</tspan>
                <tspan dx="0" dy="12">連</tspan>
            </text>
        </g>

        <!-- 03. 速喜 (右下方：斜向錯位) -->
        <g class="palace-group" onclick="selectPalace(2)" id="group-2">
            <path class="palace-path" d="M 150 150 L 262.58 215 A 130 130 0 0 1 150 280 L 150 210 A 70 70 0 0 0 192.74 174.64 Z" />
            <text class="palace-text" x="225" y="210">
                <tspan dx="0" dy="-6">速</tspan>
                <tspan dx="0" dy="12">喜</tspan>
            </text>
        </g>

        <!-- 04. 赤口 (下方：左右微錯位) -->
        <g class="palace-group" onclick="selectPalace(3)" id="group-3">
            <path class="palace-path" d="M 150 150 L 150 280 A 130 130 0 0 1 37.42 215 L 107.26 174.64 A 70 70 0 0 0 150 210 Z" />
            <text class="palace-text" x="150" y="245">
                <tspan dx="-4" dy="-3">赤</tspan>
                <tspan dx="4" dy="3">口</tspan>
            </text>
        </g>

        <!-- 05. 小吉 (左下方：斜向錯位) -->
        <g class="palace-group" onclick="selectPalace(4)" id="group-4">
            <path class="palace-path" d="M 150 150 L 37.42 215 A 130 130 0 0 1 37.42 85 L 107.26 125.36 A 70 70 0 0 0 107.26 174.64 Z" />
            <text class="palace-text" x="75" y="210">
                <tspan dx="0" dy="12">小</tspan>
                <tspan dx="0" dy="-12">吉</tspan>
            </text>
        </g>

        <!-- 06. 空亡 (左上方：符合你的「空偏下亡偏上」) -->
        <g class="palace-group" onclick="selectPalace(5)" id="group-5">
            <path class="palace-path" d="M 150 150 L 37.42 85 A 130 130 0 0 1 150 20 L 150 90 A 70 70 0 0 0 107.26 125.36 Z" />
            <text class="palace-text" x="75" y="150">
                <tspan dx="0" dy="10">空</tspan>
                <tspan dx="0" dy="-10">亡</tspan>
            </text>
        </g>

    </svg>

    <script>
        function selectPalace(index) {
            for (let i = 0; i < 6; i++) {
                document.getElementById(`group-${i}`).classList.remove('active');
            }
            document.getElementById(`group-${index}`).classList.add('active');
        }
    </script>
</body>
</html>
